name: Auto Restructure & Generate APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Complete Project Environment Setup
      run: |
        echo "1. Membuat struktur folder Android standar..."
        mkdir -p app/src/main/java/com/example/mykotlinapp
        mkdir -p app/src/main/res/values
        mkdir -p gradle/wrapper

        echo "2. Menata file kode mentah Kotlin..."
        mv *.kt app/src/main/java/com/example/mykotlinapp/ 2>/dev/null || true
        
        echo "3. Menata Resource..."
        mv colors.xml strings.xml themes.xml app/src/main/res/values/ 2>/dev/null || true

        echo "4. Membersihkan file manifest lama yang rusak..."
        rm -f AndroidManifest.xml app/src/main/AndroidManifest.xml
        rm -f ic_launcher.xml ic_launcher_foreground.xml ic_stat_nj.xml build.gradle.kts settings.gradle.kts app-build.gradle.kts root-build.gradle.kts build.gradle settings.gradle app/build.gradle

        echo "5. Mengunduh Manifest Murni Resmi anti-eror..."
        curl -s https://github.com -o app/src/main/AndroidManifest.xml || true
        
        # Jaga-jaga jika unduhan gagal, buat cadangan dengan string aman terbungkus
        if [ ! -s app/src/main/AndroidManifest.xml ]; then
          cat << 'MANIFEST_EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <application
                android:allowBackup="true"
                android:label="MyKotlinApp"
                android:supportsRtl="true">
                <activity
                    android:name="com.example.mykotlinapp.MainActivity"
                    android:theme="@android:style/Theme.Material.Light.NoActionBar"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        MANIFEST_EOF
        fi

        echo "6. Membuat file settings.gradle root..."
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MyKotlinApp"
        include ':app'
        EOF

        echo "7. Membuat file build.gradle root..."
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
        }
        EOF

        echo "8. Membuat file app/build.gradle..."
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.mykotlinapp'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.mykotlinapp"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                compose true
            }
            composeOptions {
                kotlinCompilerExtensionVersion '1.4.3'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
            implementation 'androidx.activity:activity-compose:1.7.2'
            implementation platform('androidx.compose:compose-bom:2023.05.01')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.material3:material3'
        }
        EOF

    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.1.1'

    - name: Run Android Build Compile
      run: |
        gradle assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: MyAndroidApp-DebugAPK
        path: app/build/outputs/apk/debug/app-debug.apk
        
