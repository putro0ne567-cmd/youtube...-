name: Auto Restructure & Generate APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Fix Project Structure Automatically
      run: |
        echo "Membuat struktur folder Android standar..."
        mkdir -p app/src/main/java/com/example/mykotlinapp
        mkdir -p app/src/main/res/values
        mkdir -p gradle/wrapper

        echo "Memindahkan file kode Kotlin..."
        mv *.kt app/src/main/java/com/example/mykotlinapp/ 2>/dev/null || true
        
        echo "Memindahkan Resource..."
        mv colors.xml strings.xml themes.xml app/src/main/res/values/ 2>/dev/null || true

        echo "Menghapus file ikon XML eksternal..."
        rm -f ic_launcher.xml ic_launcher_foreground.xml ic_stat_nj.xml

        echo "Menata file konfigurasi Gradle utama..."
        rm -f build.gradle.kts settings.gradle.kts app-build.gradle.kts root-build.gradle.kts
        
        if [ -f "app/build.gradle" ]; then
          echo "build.gradle aplikasi sudah ada di folder app."
        else
          mv build.gradle app/ 2>/dev/null || true
        fi

    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.1.1'

    - name: Run Android Build Compile
      run: |
        gradle assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: MyAndroidApp-DebugAPK
        path: app/build/outputs/apk/debug/app-debug.apk
        
