name: Android & Kotlin Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Make Gradle Executable
      run: chmod +x gradlew
      continue-on-error: true

    - name: Build Project
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew build
        else
          echo "File gradlew tidak ditemukan. Jika ini bukan proyek Gradle, jalankan perintah compiler Anda di sini."
        fi
        
