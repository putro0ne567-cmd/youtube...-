name: Android Code Syntax Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Verify Kotlin Files Presence
      run: |
        echo "Memeriksa daftar file di repositori:"
        ls -la
        echo "Pemeriksaan selesai. Kode berhasil diunggah ke GitHub."
        
