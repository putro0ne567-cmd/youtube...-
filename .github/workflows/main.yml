name: Kotlin Manual Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Kotlin Compiler
      run: |
        sudo snap install --classic kotlin

    - name: Compile Kotlin Files
      run: |
        kotlinc MainActivity.kt ChannelProcessor.kt ChannelSettings.kt DspViewModel.kt FilterChain.kt -include-runtime -d app.jar

    - name: Run Application Check
      run: |
        java -jar app.jar
        
