name: Android Jetpack Compose Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android Project
      run: |
        # Mencari di mana file gradlew berada dan berpindah ke folder tersebut
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        if [ -n "$GRADLEW_PATH" ]; then
          cd $(dirname "$GRADLEW_PATH")
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Error: File gradlew (Gradle) tidak ditemukan di folder manapun di repositori ini."
          echo "Pastikan Anda mengunggah seluruh folder proyek Android Studio Anda, bukan hanya file .kt saja."
          exit 1
        fi
        
